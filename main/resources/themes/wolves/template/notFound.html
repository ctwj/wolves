{{extends "./layout/layout.html"}}

{{block main()}}
<div class="container mx-auto max-w-2xl py-16">
    <div class="w-surface">
        <div class="w-24 h-24 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-exclamation-triangle text-white text-4xl"></i>
        </div>
        
        <h1 class="text-6xl font-bold w-text mb-4">404</h1>
        <h2 class="text-2xl font-semibold w-text-2 mb-4">页面未找到</h2>
        <p class="w-text-3 mb-8">抱歉，您访问的页面不存在或已被移除。</p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="px-6 py-3 w-gradient-hero text-white rounded-full font-medium hover:from-primary-600 hover:to-secondary-600 transition-all inline-flex items-center justify-center">
                <i class="fas fa-home mr-2"></i>
                返回首页
            </a>
            <button onclick="history.back()" class="px-6 py-3 w-surface border w-border w-text-2 rounded-full font-medium hover:w-sunken transition-all inline-flex items-center justify-center">
                <i class="fas fa-arrow-left mr-2"></i>
                返回上页
            </button>
        </div>
    </div>
    
    <!-- Suggested Links -->
    <div class="mt-12">
        <h3 class="text-lg font-semibold w-text mb-4 text-center">或者试试以下链接</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            {{ range i, v := Category().Limit(3).List() }}
            <a href="{{ v.URL() }}" class="w-surface rounded-xl p-4 border w-border card-hover hover:shadow-lg text-center">
                <div class="w-12 h-12 w-sunken rounded-lg flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-folder text-primary-500"></i>
                </div>
                <h4 class="font-medium w-text">{{ v.Name }}</h4>
            </a>
            {{ end }}
        </div>
    </div>
</div>
{{end}}
